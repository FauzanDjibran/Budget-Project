      '</button></span></td></tr>').join('');

  $('#view').innerHTML =
    '<div class="ph">'+crumb([{t:MODULES.find(m=>m.key===E.module).name,h:href(entitiesOf(E.module)[0].key)},
        ...((g&&g.name!==E.name)?[{t:g.name}]:[]),{t:E.name}])+
      '<div class="ph-row"><h1><span class="ph-ico">'+svg(E.icon,16)+'</span>'+esc(E.name)+'</h1>'+
      '<div class="ph-act">'+
        '<button class="btn primary" id="btnNew">'+svg(ICON.plus,15)+' Buat Dokumen</button>'+
      '</div></div>'+
      '<p class="ph-sub">'+esc(E.desc)+'</p></div>'+

    '<div class="kpis bud">'+
      '<div class="kpi wide" id="kpiCash"><div class="h"><span class="i" style="background:var(--ok-bg);color:var(--ok)">'+
        svg(ICON.wallet2,14)+'</span><span class="l">Saldo Kas &amp; Bank</span>'+
        '<span class="more">Rincian '+svg(ICON.chev,11)+'</span></div>'+
        '<div class="v">'+esc('Rp '+fmtNum(cashTotal()))+'</div>'+
        '<div class="d">'+cashRows().length+' resource aktif · setara IDR</div></div>'+
      '<div class="kpi" data-fs="Draft"><div class="h"><span class="i" style="background:var(--warn-bg);color:var(--warn)">'+
        svg(ICON.clock,14)+'</span><span class="l">Belum Diposting</span></div>'+
        '<div class="v">'+drafts.length+'</div>'+
        '<div class="d">'+esc('Rp '+fmtNum(draftAmt))+' · belum menyentuh Budget maupun saldo</div></div>'+
      '<div class="kpi" data-fs="Posted"><div class="h"><span class="i" style="background:var(--info-bg);color:var(--info)">'+
        svg(ICON.check,14)+'</span><span class="l">Sudah Diposting</span></div>'+
        '<div class="v">'+posted.length+'</div>'+
        '<div class="d">'+esc('+ Rp '+fmtNum(inAmt))+' masuk · '+esc('− Rp '+fmtNum(outAmt))+' keluar</div></div>'+
    '</div>'+

    '<div class="card"><div class="toolbar">'+
      '<div class="srch '+(S.q?'has':'')+'">'+svg(ICON.srch,14)+
        '<input id="lq" placeholder="Cari nomor dokumen, purpose, atau catatan…" value="'+esc(S.q)+'" autocomplete="off">'+
        '<button class="x" id="lqx">'+svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',13)+'</button></div>'+
      E.cols.filter(c=>c.hideCol&&c.flt).map(c=>{
        const v=S.f[c.f]||'';
        let opts='';
        if(c.flt==='ref'){
          const f=E.fields.find(x=>x.n===c.f);
          opts=(DB[f.ref]||[]).map(t=>{const d=idOf(f.ref,t);
            return '<option value="'+t.id+'"'+(String(t.id)===v?' selected':'')+'>'+esc(d.lab)+'</option>';}).join('');
        } else {
          const seen=[]; base.forEach(r=>{ if(r[c.f]!=null&&seen.indexOf(r[c.f])<0) seen.push(r[c.f]); });
          opts=seen.map(o=>'<option value="'+esc(o)+'"'+(String(o)===v?' selected':'')+'>'+
            esc(o==='In'?'Penerimaan':(o==='Out'?'Pengeluaran':o))+'</option>').join('');
        }
        return '<select class="tsel'+(v?' set':'')+'" data-flt="'+c.f+'"><option value="">'+esc(c.l)+': semua</option>'+opts+'</select>';
      }).join('')+
      activeFilterChips(E,S)+
      (nAct?'<button class="btn sm ghost" id="clrF">Bersihkan filter ('+nAct+')</button>':'')+
      '<div class="tspace"></div>'+
      '<span class="count"><b>'+shown+'</b> dari '+total+' dokumen'+
        (CTX_COMPANY?' <span class="bdg t-acc" style="margin-left:5px">1 Company</span>':'')+'</span></div>'+
    (shown
      ? '<div class="tw"><table class="grid"><thead><tr>'+th1+'</tr></thead><tbody>'+tb+'</tbody></table></div>'+
        '<div class="pager"><span class="inf">Halaman <b>'+S.page+'</b> dari <b>'+pages+'</b> ('+shown+' total)</span>'+
        '<select class="psel" id="per">'+[10,25,50,100].map(x=>'<option value="'+x+'"'+(x===pp?' selected':'')+'>Tampil '+x+'</option>').join('')+'</select>'+
        '<div class="pgs"><button class="pg" data-p="1"'+(S.page<=1?' disabled':'')+'>«</button>'+
        '<button class="pg" data-p="'+(S.page-1)+'"'+(S.page<=1?' disabled':'')+'>‹</button>'+pageBtns(S.page,pages)+
        '<button class="pg" data-p="'+(S.page+1)+'"'+(S.page>=pages?' disabled':'')+'>›</button>'+
        '<button class="pg" data-p="'+pages+'"'+(S.page>=pages?' disabled':'')+'>»</button></div></div>'
      : '<div class="tw"><table class="grid"><thead><tr>'+th1+'</tr></thead></table></div>'+
        '<div class="empty"><div class="ic">'+svg(total?ICON.srch:E.icon,20)+'</div>'+
        '<h4>'+(total?'Tidak ada dokumen yang cocok':'Belum ada dokumen kas/bank')+'</h4>'+
        '<p>'+(total?'Ubah kata kunci atau bersihkan filter yang sedang aktif.'
                    :'Dokumen kas/bank merealisasikan Budget yang sudah disetujui. Mulai dengan memilih Transaction Purpose.')+'</p>'+
        '<div class="cta">'+(total?'<button class="btn" id="clrF2">Bersihkan filter</button>'
          :'<button class="btn primary" id="btnNew2">'+svg(ICON.plus,15)+' Buat Dokumen</button>')+'</div></div>')+
    '</div>'+
    '<p class="foot-note">Tanggal Dokumen dicatat saat dokumen diposting — dokumen Draft belum punya tanggal karena belum '+
    'berdampak ke kas/bank. Realisasi juga tidak melihat Tanggal Budget: selisih keduanya disimpan sebagai bahan laporan '+
    'realisasi lebih awal / terlambat, bukan sebagai penghalang eligibility (Konsep v3 §9).</p>';

  $('#kpiCash').onclick=openBalanceModal;
  $$('#view .kpi[data-fs]').forEach(k=>k.onclick=()=>{ S.f={status:k.dataset.fs}; S.page=1; viewCbt(); });
  const nw=()=>go(href(key,'new'));
  if($('#btnNew'))  $('#btnNew').onclick=nw;
  if($('#btnNew2')) $('#btnNew2').onclick=nw;
  const qi=$('#lq');
  qi.oninput=()=>{ S.q=qi.value; S.page=1; viewCbt(); const n=$('#lq'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  $('#lqx').onclick=()=>{ S.q=''; S.page=1; viewCbt(); };
  $$('#view [data-fx]').forEach(b=>b.onclick=()=>{ delete S.f[b.dataset.fx]; S.page=1; viewCbt(); });
  $$('#view [data-flt]').forEach(el=>{
    const f=el.dataset.flt;
    el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{
      S.f[f]=el.value; S.page=1; const pos=el.selectionStart, tag=el.tagName; viewCbt();
      const n=$('#view [data-flt="'+f+'"]'); if(n){ n.focus(); if(tag==='INPUT'&&n.setSelectionRange) n.setSelectionRange(pos,pos); }
    });
  });
  const clr=()=>{ S.f={}; S.q=''; S.page=1; viewCbt(); };
  if($('#clrF'))  $('#clrF').onclick=clr;
  if($('#clrF2')) $('#clrF2').onclick=clr;
  $$('#view th[data-s]').forEach(t=>t.onclick=()=>{
    cycleSort(S,t.dataset.s); viewCbt();
  });
  if($('#per')) $('#per').onchange=e=>{ S.per=+e.target.value; S.page=1; viewCbt(); };
  $$('#view .pg').forEach(b=>b.onclick=()=>{ S.page=Math.max(1,Math.min(pages,+b.dataset.p)); viewCbt(); });
  $$('#view tbody tr').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('.acts')) return; go(href(key,tr.dataset.id)); });
  $$('#view [data-v]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); go(href(key,b.dataset.v)); });
  $$('#view [data-e]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); go(href(key,b.dataset.e,'edit')); });
  $$('#view [data-k]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=+b.dataset.k, r=b.getBoundingClientRect();
    menuAt(r.left-180,r.bottom+6,cbtActions(id,true));
  });
}

/* ============================================================ form dokumen */
function viewCbtForm(){
  const key='fin_cash_bank_transaction', E=ENTITIES[key];
  const creating=state.mode==='new';
  const row=creating?null:(DB[key]||[]).find(r=>r.id===state.id);
  if(!creating && !row){
    $('#view').innerHTML='<div class="card"><div class="empty"><div class="ic">'+svg(ICON.warn,20)+'</div>'+
      '<h4>Dokumen tidak ditemukan</h4><p>Record ini tidak tersedia lagi.</p>'+
      '<div class="cta"><button class="btn primary" id="bk">Kembali ke '+esc(E.name)+'</button></div></div></div>';
    $('#bk').onclick=()=>go(href(key)); return;
  }
  const editing=creating||state.mode==='edit';
  if(editing && !draft) buildDraft();
  if(editing) cbtSyncHeader();
  const data=editing?draft:row;

  const pr=purposeOf(data.purpose);
  const hasBank=companyHasBank(data.company_id);
  const prov=treasuryProviderOf(data.company_id);
  const ready=cbtHeaderReady(data);
  const lines=editing? (draft._lines||[]) : linesOf(row.id).map(l=>({
    budget_id:Number(l.source_doc_id), outstanding:Number(l.outstanding_amount), amount:Number(l.settlement_amount)}));
  const totalAmt=editing? cbtLinesTotal(lines) : Number(row.transaction_amount||0);
  const curId=editing? draft.currency_id : row.currency_id;

  const backTo=href(key);
  const title=creating? 'Dokumen Baru' : row.transaction_no;

  /* ---- aksi ---- */
  let nav='';
  if(!creating && !editing){
    const all=cbtScoped((DB[key]||[]).slice()).sort((a,b)=>{ const ka=docDateKey(a), kb=docDateKey(b);
      return ka<kb?1:(ka>kb?-1:b.id-a.id); });
    const i=all.findIndex(r=>r.id===row.id);
    nav='<div class="rnav">'+
      '<button data-nav="'+(i>0?all[i-1].id:'')+'"'+(i<=0?' disabled':'')+' title="Sebelumnya">'+svg(ICON.back,13)+'</button>'+
      '<span>'+(i+1)+' / '+all.length+'</span>'+
      '<button data-nav="'+(i<all.length-1?all[i+1].id:'')+'"'+(i>=all.length-1?' disabled':'')+' title="Berikutnya">'+svg(ICON.chev,13)+'</button></div>';
  }
  let acts;
  if(editing){
    acts='<button class="btn" id="fCancel">Batal</button>'+
         '<button class="btn primary" id="fSave">'+svg(ICON.save,15)+' Simpan</button>';
  } else if(row.status==='Draft'){
    acts=nav+'<button class="btn" id="fEdit">'+svg(ICON.pen,15)+' Ubah</button>'+
         '<button class="btn primary" id="bPost"'+(linesOf(row.id).length?'':' disabled title="Tambahkan minimal satu Budget"')+'>'+
         svg(ICON.check,15)+' Post</button>'+
         '<button class="btn ico" id="bMore" title="Aksi lain">'+
         svg('<circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/>',15)+'</button>';
  } else {
    acts=nav+'<span class="lockchip">'+svg(ICON.lock,13)+' '+(row.status==='Posted'?'Terkunci setelah Post':'Dokumen dibatalkan')+'</span>';
  }

  /* ---- field header ---- */
  const hf=E.fields.filter(f=>f.n!=='note');
  const nt=E.fields.filter(f=>f.n==='note');
  const head=
    '<div class="fsec"><div class="sec-t">Header Dokumen'+
      '<span class="h">Kombinasi Purpose · Company · Partner · Cash &amp; Bank menentukan Budget yang dapat direalisasikan</span></div>'+
      '<div class="frow">'+hf.map(f=>fieldHtml(E,f,data,editing,row)).join('')+'</div></div>'+
    (nt.length?'<div class="fsec"><div class="frow" style="padding-top:14px">'+nt.map(f=>fieldHtml(E,f,data,editing,row)).join('')+'</div></div>':'');

  /* ---- peringatan Company anak ---- */
  const childBox = (data.company_id && !hasBank)
    ? '<div class="nbox warn"><span class="ni">'+svg(ICON.warn,15)+'</span><div><b>'+
        esc(idText('sys_company',data.company_id))+' tidak memiliki Cash &amp; Bank sendiri.</b>'+
        '<p>Kebutuhan dana Company anak dipenuhi oleh treasury provider '+
        (prov? '<b>'+esc(prov.company_label)+'</b>' : 'Company induk')+
        ' melalui <b>Funding Request</b> (Konsep v3 §26–§29). Alur tersebut adalah cakupan berikutnya '+
        'pada mock-up ini; dokumen kas/bank langsung hanya tersedia untuk Company yang memiliki Cash &amp; Bank.</p></div></div>'
    : '';

  /* ---- tabel line ---- */
  const lineRows=lines.map((l,i)=>{
    const b=(DB.bud_budget||[]).find(x=>Number(x.id)===Number(l.budget_id));
    if(!b) return '';
    const over=Number(l.amount)>Number(l.outstanding);
    const full=Number(l.amount)>=Number(l.outstanding);
    return '<tr'+(over?' class="overrow"':'')+' data-li="'+i+'">'+
      '<td class="no">'+(i+1)+'</td>'+
      '<td><span class="lab">'+esc(b.budget_no)+'</span></td>'+
      '<td class="pri"><span class="dstack"><span class="d1">'+esc(b.description)+'</span>'+
        '<span class="d2">'+esc(fmtDate(b.budget_date))+' · '+esc(labOnly('sys_budget_category',b.category_id)||'—')+'</span></span></td>'+
      '<td class="num"><span class="mny">'+esc(fmtMoney(b.budget_amount,b.currency_id))+'</span></td>'+
      '<td class="num"><span class="mny'+(Number(l.outstanding)?'':' z')+'">'+esc(fmtMoney(l.outstanding,b.currency_id))+'</span></td>'+
      '<td class="num">'+(editing
        ? '<input class="inp lmny'+(over?' over':'')+'" data-lm="'+i+'" inputmode="numeric" autocomplete="off" value="'+esc(fmtNum(l.amount))+'">'
        : '<span class="mny'+(over?' over':'')+'">'+esc(fmtMoney(l.amount,b.currency_id))+'</span>')+
        (over?'<span class="overtag" title="Realisasi melebihi outstanding">Over '+esc(fmtMoney(Number(l.amount)-Number(l.outstanding),b.currency_id))+'</span>'

      (editing? '<td class="acts"><button class="iact del" data-lx="'+i+'" title="Keluarkan dari dokumen">'+svg(ICON.trash,14)+'</button></td>'
              : '<td class="acts"><button class="iact" data-bg="'+b.id+'" title="Buka Budget">'+svg(ICON.eye,14)+'</button></td>')+
      '</tr>';
  }).join('');

  const cbNow=(DB.m_cash_bank||[]).find(c=>Number(c.id)===Number(data.cash_bank_id));
  const dirIn=pr&&pr.dir==='In';
  const accTarget=pr? purposeAccount(data.purpose, data.company_id, DB) : null;
  const saldoAfter=cbNow? Number(cbNow.balance||0)+((editing||(row&&row.status==='Draft'))?(dirIn?1:-1)*totalAmt:0) : 0;

    '<div class="impact">'+

      '<div class="ir"><span>Cash &amp; Bank</span><b>'+(cbNow? esc(cbNow.cash_bank_label):'—')+'</b></div>'+
      (accTarget? '<div class="ir"><span>Account tujuan</span><b>'+esc(accTarget.account_label)+'</b></div>' : '')+
      (curId&&curLabel(curId)!=='IDR'
        ? '<div class="ir"><span>Setara IDR</span><b>'+esc('Rp '+fmtNum(toBase(totalAmt,curId)))+'</b></div>' : '')+
      (cbNow? '<div class="ir"><span>'+
          (row&&row.status==='Posted'? 'Saldo '+esc(cbNow.cash_bank_label)+' kini'
           : (row&&row.status==='Cancelled'? 'Saldo tidak berubah' : 'Saldo setelah posting'))+
          '</span><b>'+esc(fmtMoney(row&&row.status==='Cancelled'? cbNow.balance : saldoAfter, cbNow.currency_id))+'</b></div>' : '')+
    '</div>';

  const lineCard=
    '<div class="card" style="margin-top:14px"><div class="card-h">'+
      '<span class="ci">'+svg(ICON.clip,15)+'</span>'+
      '<div class="ct"><h3>Budget yang Direalisasikan</h3>'+
      '<p>Satu dokumen dapat merealisasikan beberapa Budget sekaligus selama memenuhi kriteria header</p></div>'+
      (editing? '<button class="btn sm primary" id="bAdd"'+(ready?'':' disabled title="Lengkapi header dokumen terlebih dahulu"')+'>'+
        svg(ICON.plus,14)+' Tambah Budget</button>':'<span class="hint">'+lines.length+' budget</span>')+'</div>'+
    (CBT_DROP&&editing? '<div class="nbox warn slim"><span class="ni">'+svg(ICON.warn,14)+'</span><div>'+
        '<b>'+CBT_DROP+' baris dikeluarkan otomatis.</b><p>Budget tersebut tidak lagi memenuhi kriteria header yang baru.</p></div></div>':'')+
    (errs._lines&&editing? '<div class="nbox bad slim"><span class="ni">'+svg(ICON.warn,14)+'</span><div>'+
        '<b>'+esc(errs._lines)+'</b></div></div>':'')+
    (lines.length
      ? '<div class="tw"><table class="grid ltab"><thead><tr>'+
          '<th style="width:34px">No</th><th style="width:92px">Budget</th><th>Deskripsi</th>'+
          '<th class="num" style="width:124px">Nominal Budget</th>'+
          '<th class="num" style="width:124px">Outstanding</th>'+
          '<th class="num" style="width:'+(editing?'164px':'150px')+'">Realisasi Dokumen</th>'+
          '<th style="width:44px"></th></tr></thead><tbody>'+lineRows+'</tbody>'+
          '<tfoot><tr class="totrow"><td colspan="5" style="text-align:right">Total Realisasi Dokumen</td>'+
          '<td class="num"><span class="mny big">'+esc(fmtMoney(totalAmt,curId))+'</span></td><td></td></tr></tfoot>'+
        '</table></div>'
      : '<div class="empty sm"><div class="ic">'+svg(ICON.clip,18)+'</div>'+
        '<h4>'+(editing? (ready?'Belum ada Budget dipilih':'Lengkapi header dokumen') : 'Dokumen tanpa Budget')+'</h4>'+
        '<p>'+(editing

          : 'Tidak ada line pada dokumen ini.')+'</p></div>')+
    (impact? '<div class="cardfoot">'+impact+'</div>' : '')+
    '</div>';

  /* ---- panel samping ---- */
  const side='<div class="card side"><div class="card-h"><span class="ci">'+svg(ICON.file,15)+'</span><div class="ct"><h3>Ringkasan</h3></div></div>'+
    '<div class="card-b"><div style="padding:5px 0">'+
      (creating
        ? '<div class="mrow"><span class="k">Nomor</span><span class="v"><span class="dash">dibuat otomatis</span></span></div>'+
          '<div class="mrow"><span class="k">Status</span><span class="v">Belum tersimpan</span></div>'

          '<div class="mrow"><span class="k">Posting</span><span class="v">'+

          '<div class="mrow"><span class="k">Dibuat</span><span class="v">'+esc(fmtTs(row.created_at))+
            '<small>'+esc(uMail(row.created_by))+'</small></span></div>'+
          '<div class="mrow"><span class="k">Diubah</span><span class="v">'+
            (row.updated_by? esc(fmtTs(row.updated_at))+'<small>'+esc(uMail(row.updated_by))+'</small>'

      '<div class="mrow"><span class="k">Purpose</span><span class="v">'+
        (pr? esc(pr.label)+'<small class="mono">'+esc(pr.k)+'</small>' : '<span class="dash">belum dipilih</span>')+'</span></div>'+
      '<div class="mrow"><span class="k">Klasifikasi</span><span class="v">'+

      '<div class="mrow"><span class="k">Account</span><span class="v">'+
        (accTarget? '<span class="lab">'+esc(accTarget.account_label)+'</span> '+esc(accTarget.account_name)

    '</div></div>'+
    (creating||editing? '' :
      '<div class="card-b" style="border-top:1px solid var(--line-2)">'+
      '<p class="sidenote">'+(row.status==='Posted'
        ? 'Dokumen sudah menjadi transaksi aktual: realized_amount Budget dan saldo Cash &amp; Bank sudah bergerak. Historical record bersifat append-only — koreksi dilakukan sebagai dokumen baru (Konsep v3 §15).'
        : (row.status==='Draft'
          ? 'Dokumen masih Draft. Budget dan saldo Cash &amp; Bank belum bergerak, dan Tanggal Dokumen belum dicatat.'
          : 'Dokumen dibatalkan sebelum Post, sehingga tidak pernah menyentuh Budget maupun saldo.'))+'</p></div>')+
    '</div>';

  $('#view').innerHTML =
    '<div class="ph">'+crumb([{t:'Finance',h:backTo},{t:E.name,h:backTo},{t:creating?'Baru':row.transaction_no}], backTo)+
      '<div class="ph-row"><h1><span class="ph-ico">'+svg(E.icon,16)+'</span>'+esc(title)+
        (creating?'':' <span class="lab lg">'+esc(purposeLabel(row.purpose))+'</span>')+
        (creating||editing?'':' '+statusBadge(row.status,false))+
        (state.mode==='edit'?' <span class="bdg t-warn">Mode Ubah</span>':'')+'</h1>'+
      '<div class="ph-act">'+acts+'</div></div>'+
      '<p class="ph-sub">'+esc(E.desc)+'</p></div>'+
    '<div class="fgrid"><div>'+
      '<div class="card">'+head+
        (editing&&dirty?'<div class="dirty"><span class="msg"><span class="pulse"></span>Ada perubahan yang belum disimpan</span>'+
          '<button class="btn sm" id="dCancel">Batal</button><button class="btn primary sm" id="dSave">'+svg(ICON.save,14)+' Simpan</button></div>':'')+
      '</div>'+
      childBox+
      (hasBank? lineCard : '')+
    '</div><div>'+side+'</div></div>'+
    (creating? '' : auditCard(key,row));

  /* ---- binding ---- */
  $$('#view [data-nav]').forEach(b=>{ if(b.dataset.nav) b.onclick=()=>go(href(key,b.dataset.nav)); });
  $$('#view [data-h]').forEach(e=>{ e.onclick=()=>go(e.dataset.h); e.style.cursor='pointer'; });
  $$('#view [data-bg]').forEach(b=>b.onclick=()=>go(href('bud_budget',b.dataset.bg)));
  if($('#fEdit')) $('#fEdit').onclick=()=>{ CBT_DROP=0; go(href(key,row.id,'edit')); };
  if($('#bPost')) $('#bPost').onclick=()=>cbtPost(row.id);
  if($('#bMore')) $('#bMore').onclick=e=>{
    const r=e.currentTarget.getBoundingClientRect();
    menuAt(r.left-180,r.bottom+6,cbtActions(row.id,false));
  };
  if($('#bAdd')) $('#bAdd').onclick=openBudgetPicker;
  $$('#view [data-lx]').forEach(b=>b.onclick=()=>{
    draft._lines.splice(+b.dataset.lx,1); dirty=true; viewCbtForm();
  });
  $$('#view [data-lm]').forEach(el=>{
    el.addEventListener('input',()=>{
      const i=+el.dataset.lm, raw=el.value.replace(/[^0-9]/g,'');
      draft._lines[i].amount=raw? Number(raw):0; dirty=true;
      el.value=raw? fmtNum(Number(raw)) : '';
      const pos=el.value.length;
      viewCbtForm();
      const n=$('#view [data-lm="'+i+'"]');
      if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
    });
  });
  const cancel=()=>{ draft=null;errs={};dirty=false;CBT_DROP=0; creating? go(href(key)) : go(href(key,row.id)); };
  const doSave=()=>saveCbt(creating?null:row);
  if($('#fCancel')) $('#fCancel').onclick=cancel;
  if($('#dCancel')) $('#dCancel').onclick=cancel;
  if($('#fSave'))   $('#fSave').onclick=doSave;
  if($('#dSave'))   $('#dSave').onclick=doSave;
  bindFields(E,editing,row);
}

function drawBudgetPicker(){

  const taken=(d._lines||[]).map(l=>Number(l.budget_id));
  const pool=eligibleBudgets(d).filter(b=>taken.indexOf(Number(b.id))<0);

  const crit='<div class="critbar">'+
    '<span class="cr"><i>Purpose</i>'+esc(pr?pr.label:'—')+'</span>'+
    '<span class="cr"><i>Company</i>'+esc(idText('sys_company',d.company_id)||'—')+'</span>'+
    '<span class="cr"><i>Tipe Budget</i>'+esc(pr? (pr.dir==='In'?'Penerimaan':'Pengeluaran') :'—')+'</span>'+
    '<span class="cr"><i>Category</i>'+esc(pr? pr.cat : '—')+'</span>'+
    (pr&&pr.pcat? '<span class="cr"><i>Partner</i>'+esc(idText('m_partner',d.partner_id)||'—')+
        '<em>'+esc(pr.pcat)+'</em></span>':'')+
    '<span class="cr"><i>Currency</i>'+esc(cb? curLabel(cb.currency_id):'—')+'</span>'+
    '<span class="cr"><i>Status</i>Open · outstanding &gt; 0</span>'+
  '</div>';

  const rows=pool.map(b=>{
    const on=PICK[b.id]!==undefined;
    const out=outstandingOf(b);
    const val=on? PICK[b.id] : out;
    const over=Number(val)>out;
    const alloc=draftAllocOf(b.id, state.mode==='edit'? state.id : 0);
    return '<tr class="'+(on?'on':'off')+'" data-pb="'+b.id+'">'+
      '<td class="pkchk"><input type="checkbox"'+(on?' checked':'')+'></td>'+
      '<td><span class="lab">'+esc(b.budget_no)+'</span></td>'+
      '<td class="mono" style="font-size:11px">'+esc(fmtDate(b.budget_date))+'</td>'+
      '<td class="pri"><span class="dstack"><span class="d1">'+esc(b.description)+'</span>'+
        '<span class="d2">'+esc(labOnly('sys_budget_category',b.category_id)||'—')+
        (b.partner_id? ' · '+esc(labOnly('m_partner',b.partner_id)) : '')+'</span></span></td>'+
      '<td class="num"><span class="mny">'+esc(fmtMoney(b.budget_amount,b.currency_id))+'</span></td>'+
      '<td class="num"><span class="mny'+(Number(b.realized_amount)?'':' z')+'">'+esc(fmtMoney(b.realized_amount,b.currency_id))+'</span></td>'+
      '<td class="num"><span class="mstack"><span class="mny">'+esc(fmtMoney(out,b.currency_id))+'</span>'+
        (alloc? '<span class="rz warnrz" title="Sedang dialokasikan dokumen Draft lain">draft lain '+esc(fmtMoney(alloc,b.currency_id))+'</span>':'')+
        '</span></td>'+
      '<td class="num"><input class="inp lmny'+(over?' over':'')+'" data-pm="'+b.id+'" inputmode="numeric" autocomplete="off"'+
        (on?'':' disabled')+' value="'+esc(fmtNum(val))+'">'+
        (over?'<span class="overtag">Over</span>':'')+'</td></tr>';
  }).join('');

  const chosen=Object.keys(PICK);
  const tot=chosen.reduce((t,k)=>t+Number(PICK[k]||0),0);

  $('#pkBody').innerHTML = crit+
    (pool.length
      ? '<div class="tw"><table class="grid pkt2"><thead><tr>'+
          '<th style="width:34px"></th><th style="width:88px">Nomor</th><th style="width:80px">Tanggal</th>'+
          '<th>Deskripsi</th><th class="num" style="width:118px">Nominal Budget</th>'+
          '<th class="num" style="width:112px">Sudah Real.</th><th class="num" style="width:138px">Outstanding</th>'+
          '<th class="num" style="width:150px">Realisasi</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      : '<div class="empty sm" style="margin-top:14px"><div class="ic">'+svg(ICON.srch,18)+'</div>'+
        '<h4>Tidak ada Budget yang memenuhi kriteria</h4>'+
        '<p>Budget harus berstatus <b>Disetujui (Open)</b>, milik Company yang sama, bertipe '+
        esc(pr? (pr.dir==='In'?'Penerimaan':'Pengeluaran'):'—')+', ber-Category '+esc(pr?pr.cat:'—')+
        (pr&&pr.pcat? ', ber-Partner '+esc(idText('m_partner',d.partner_id)||'—') : '')+
        ', dalam Currency '+esc(cb?curLabel(cb.currency_id):'—')+', dan masih menyisakan outstanding.</p></div>');

  $('#pkFoot').innerHTML =
    '<span class="fnote"><b>'+chosen.length+'</b> budget dipilih · total <b>'+
      esc(fmtMoney(tot, cb? cb.currency_id : 1))+'</b></span>'+
    '<button class="btn" id="pkNo">Batal</button>'+
    '<button class="btn primary" id="pkYes"'+(chosen.length?'':' disabled')+'>'+svg(ICON.plus,14)+' Tambahkan ke Dokumen</button>';

    tr.onclick=e=>{
      if(e.target.closest('input[data-pm]')) return;
      const id=+tr.dataset.pb, b=(DB.bud_budget||[]).find(x=>x.id===id);
      if(PICK[id]!==undefined) delete PICK[id]; else PICK[id]=outstandingOf(b);
      drawBudgetPicker();
    };
  });
  $$('#pkBody input[data-pm]').forEach(el=>{
    el.addEventListener('input',()=>{
      const id=+el.dataset.pm, raw=el.value.replace(/[^0-9]/g,'');
      PICK[id]=raw? Number(raw):0;
      const pos=raw? fmtNum(Number(raw)).length : 0;
      drawBudgetPicker();
      const n=$('#pkBody [data-pm="'+id+'"]');
      if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
    });
    el.addEventListener('click',e=>e.stopPropagation());
  });
  $('#pkNo').onclick=closeLayer;
  $('#pkYes').onclick=()=>{
    Object.keys(PICK).forEach(k=>{
      const b=(DB.bud_budget||[]).find(x=>x.id===Number(k)); if(!b) return;
      const amt=Number(PICK[k]||0); if(amt<=0) return;
      draft._lines.push({budget_id:Number(k), outstanding:outstandingOf(b), amount:amt});
    });
    dirty=true; closeLayer(); viewCbtForm();
  };
}

/* ================================================================ workflow */
function saveCbt(cur){
  const key='fin_cash_bank_transaction', E=ENTITIES[key];
  errs={}; cbtSyncHeader();
  if(!draft.purpose)       errs.purpose='Transaction Purpose wajib dipilih.';
  if(!draft.company_id)    errs.company_id='Company wajib dipilih.';
  if(draft.company_id && !companyHasBank(draft.company_id))
    errs.company_id='Company ini tidak memiliki Cash & Bank. Realisasinya melalui Funding Request.';
  if(purposeNeedsPartner(draft.purpose) && !draft.partner_id)
    errs.partner_id='Purpose ini mensyaratkan Partner.';
  if(companyHasBank(draft.company_id) && !draft.cash_bank_id)
    errs.cash_bank_id='Cash & Bank wajib dipilih.';
  const lines=(draft._lines||[]).filter(l=>Number(l.amount)>0);
  /* dokumen tanpa Budget tidak punya arti: tidak boleh disimpan */
  if(!Object.keys(errs).length && !lines.length)
    errs._lines = (draft._lines||[]).length
      ? 'Nominal realisasi setiap Budget harus lebih dari nol.'
      : 'Dokumen harus merealisasikan minimal satu Budget.';

  if(Object.keys(errs).length){
    viewCbtForm();
    const b=$('#view .bad'); if(b) b.focus();
    toast('Belum bisa disimpan', errs._lines || (Object.keys(errs).length+' isian perlu diperbaiki.'),'err');
    return;
  }

  const pr=purposeOf(draft.purpose);
  const cb=(DB.m_cash_bank||[]).find(c=>Number(c.id)===Number(draft.cash_bank_id));
  const rate=RATE[curLabel(cb.currency_id)]||1;
  const total=cbtLinesTotal(lines);
  const base={
    document_date: cur? (cur.document_date||null) : null,   /* diisi saat Post */
    transaction_type: pr.dir,
    company_id: Number(draft.company_id),
    purpose: draft.purpose,
    cash_bank_id: Number(draft.cash_bank_id),
    currency_id: Number(cb.currency_id),
    exchange_rate: rate,
    partner_id: pr.pcat? Number(draft.partner_id) : null,
    transaction_amount: total,
    transaction_base_amount: total*rate,
    note: draft.note||''
  };

  let tx;
  if(cur){
    tx=cur; Object.assign(tx, base, {updated_by:CURRENT_USER, updated_at:nowTs()});
    DB.fin_cash_bank_transaction_line=(DB.fin_cash_bank_transaction_line||[])
      .filter(l=>Number(l.transaction_id)!==Number(tx.id));
    logChange(key,tx.id,'UPDATE');
  } else {
    tx=Object.assign({id:nextId(key)}, base, {
      transaction_no: genCode(key), posting_date:null, status:'Draft',
      created_by:CURRENT_USER, updated_by:null, created_at:nowTs(), updated_at:nowTs()
    });
    DB[key].push(tx); logChange(key,tx.id,'TAMBAH');
  }
  let lid=nextId('fin_cash_bank_transaction_line');
  lines.forEach((l,i)=>{
    DB.fin_cash_bank_transaction_line.push({
      id: lid++, transaction_id: tx.id, sequence_no: i+1,
      source_doc_type_id: 1, source_doc_id: Number(l.budget_id),
      outstanding_amount: Number(l.outstanding),
      settlement_amount: Number(l.amount),
      settlement_base_amount: Number(l.amount)*rate,
      settlement_exchange_rate: 1,
      transaction_amount: Number(l.amount),
      transaction_base_amount: Number(l.amount)*rate,
      created_by:CURRENT_USER, updated_by:null, created_at:nowTs(), updated_at:nowTs()
    });
  });
  saveDB(); draft=null; dirty=false; CBT_DROP=0;
  if(cur){ go(href(key,tx.id)); render(); toast('Perubahan tersimpan','Dokumen '+tx.transaction_no+' diperbarui.','ok'); }
  else { toast('Dokumen dibuat','Nomor '+tx.transaction_no+' dibuat otomatis. Dokumen masih Draft.','ok'); go(href(key,tx.id)); }
}

function cbtPost(id){
  const tx=(DB.fin_cash_bank_transaction||[]).find(t=>t.id===Number(id)); if(!tx) return;
  if(tx.status!=='Draft') return;
  const lines=linesOf(tx.id);
  if(!lines.length){ toast('Belum ada Budget','Tambahkan minimal satu Budget sebelum Post.','err'); return; }

  /* validasi ulang: Budget bisa saja sudah ditutup dokumen lain */
  const bad=lines.filter(l=>{
    const b=(DB.bud_budget||[]).find(x=>Number(x.id)===Number(l.source_doc_id));
    return !b || b.status!=='Open';
  });
  if(bad.length){
    modal('<div class="mi" style="background:var(--bad-bg);color:var(--bad)">'+svg(ICON.warn,21)+'</div>'+
      '<h3>Tidak Dapat Diposting</h3>'+
      '<p>'+bad.length+' Budget pada dokumen ini sudah tidak berstatus <b>Disetujui (Open)</b>, '+
      'kemungkinan sudah ditutup oleh dokumen lain. Ubah dokumen dan keluarkan baris tersebut.</p>'+
      '<div class="mf"><button class="btn primary" id="mOk">Tutup</button></div>');
    $('#mOk').onclick=closeLayer; return;
  }

  const cb=(DB.m_cash_bank||[]).find(c=>Number(c.id)===Number(tx.cash_bank_id));
  const closing=[], over=[];
  lines.forEach(l=>{
    const b=(DB.bud_budget||[]).find(x=>Number(x.id)===Number(l.source_doc_id));
    const after=Number(b.realized_amount||0)+Number(l.settlement_amount||0);
    if(after>=Number(b.budget_amount||0)) closing.push(b);
    if(Number(l.settlement_amount)>outstandingOf(b)) over.push({b:b,x:Number(l.settlement_amount)-outstandingOf(b)});
  });
  const dir=tx.transaction_type==='In';
  const after=Number(cb.balance||0)+(dir?1:-1)*Number(tx.transaction_amount||0);

  modal('<div class="mi" style="background:var(--ok-bg);color:var(--ok)">'+svg(ICON.check,21)+'</div>'+
    '<h3>Post Dokumen '+esc(tx.transaction_no)+'</h3>'+
    '<p>Post menjadikan dokumen ini transaksi aktual. Tanggal dokumen dicatat sekarang, dan setelah diposting dokumen tidak dapat diubah maupun dibatalkan.</p>'+
    '<div class="apsum" style="margin-top:14px;text-align:left">'+
      '<div><span>Purpose</span><b>'+esc(purposeLabel(tx.purpose))+'</b></div>'+
      '<div><span>Tanggal dokumen</span><b>'+esc(fmtDate(nowTs().slice(0,10)))+'</b></div>'+
      '<div><span>Budget direalisasi</span><b>'+lines.length+' budget</b></div>'+
      '<div class="amt"><span>Nominal</span><b>'+esc(fmtMoney(tx.transaction_amount,tx.currency_id))+'</b></div>'+
      '<div><span>'+esc(cb.cash_bank_label)+' sesudah</span><b>'+esc(fmtMoney(after,cb.currency_id))+'</b></div>'+
    '</div>'+
    (closing.length? '<div class="apmap">'+svg(ICON.lock,14)+esc(closing.length+' Budget akan berubah status menjadi Selesai (Closed).')+'</div>':'')+
    (over.length? '<div class="apmap warn">'+svg(ICON.warn,14)+
      esc(over.length+' Budget direalisasikan melebihi outstanding. Over-realisasi diizinkan dan tetap menutup Budget.')+'</div>':'')+
    (after<0? '<div class="apmap warn">'+svg(ICON.warn,14)+'Saldo '+esc(cb.cash_bank_label)+' menjadi negatif setelah posting.</div>':'')+
    '<div class="mf"><button class="btn" id="mNo">Batal</button>'+
    '<button class="btn primary" id="mYes">'+svg(ICON.check,15)+' Ya, Post</button></div>');
  $('#layer .modal').style.width='min(470px,94vw)';
  $('#mNo').onclick=closeLayer;
  $('#mYes').onclick=()=>{
    lines.forEach(l=>{
      const b=DB.bud_budget.find(x=>Number(x.id)===Number(l.source_doc_id));
      b.realized_amount=Number(b.realized_amount||0)+Number(l.settlement_amount||0);
      if(b.realized_amount>=Number(b.budget_amount||0)) b.status='Closed';
      b.updated_by=CURRENT_USER; b.updated_at=nowTs();
      logChange('bud_budget',b.id,'UPDATE');
    });
    cb.balance=Number(cb.balance||0)+(dir?1:-1)*Number(tx.transaction_amount||0);
    cb.updated_by=CURRENT_USER; cb.updated_at=nowTs();
    const now=nowTs();
    tx.status='Posted'; tx.document_date=now.slice(0,10); tx.posting_date=now;
    tx.updated_by=CURRENT_USER; tx.updated_at=now;
    logChange('fin_cash_bank_transaction',tx.id,'UPDATE');
    saveDB(); closeLayer(); render();
    toast('Dokumen diposting',
      lines.length+' Budget terealisasi'+(closing.length? ' · '+closing.length+' Budget ditutup':'')+'.','ok');
  };
}

function cbtCancel(id){
  const tx=(DB.fin_cash_bank_transaction||[]).find(t=>t.id===Number(id)); if(!tx||tx.status!=='Draft') return;
  modal('<div class="mi" style="background:var(--warn-bg);color:var(--warn)">'+svg(ICON.block,20)+'</div>'+
    '<h3>Batalkan Dokumen</h3><div class="subj">'+esc(tx.transaction_no)+'</div>'+
    '<p>Dokumen ditandai Dibatalkan dan tidak dapat diposting lagi. Budget dan saldo Cash &amp; Bank tidak terpengaruh karena dokumen belum pernah diposting.</p>'+
    '<div class="mf"><button class="btn" id="mNo">Batal</button>'+
    '<button class="btn solid-danger" id="mYes">Ya, Batalkan</button></div>');
  $('#mNo').onclick=closeLayer;
  $('#mYes').onclick=()=>{
    tx.status='Cancelled'; tx.updated_by=CURRENT_USER; tx.updated_at=nowTs();
    logChange('fin_cash_bank_transaction',tx.id,'UPDATE'); saveDB(); closeLayer(); render();
    toast('Dokumen dibatalkan',esc(tx.transaction_no)+' tidak dapat diposting lagi.','ok');
  };
}
function cbtDelete(id){
  const tx=(DB.fin_cash_bank_transaction||[]).find(t=>t.id===Number(id)); if(!tx||tx.status==='Posted') return;
  modal('<div class="mi" style="background:var(--bad-bg);color:var(--bad)">'+svg(ICON.trash,20)+'</div>'+
    '<h3>Hapus Dokumen</h3><div class="subj">'+esc(tx.transaction_no)+'</div>'+
    '<p>Dokumen beserta seluruh line-nya dihapus permanen. Hanya dokumen yang belum diposting yang dapat dihapus.</p>'+
    '<div class="mf"><button class="btn" id="mNo">Batal</button><button class="btn solid-danger" id="mYes">Ya, Hapus</button></div>');
  $('#mNo').onclick=closeLayer;
  $('#mYes').onclick=()=>{
    DB.fin_cash_bank_transaction=DB.fin_cash_bank_transaction.filter(t=>t.id!==tx.id);
    DB.fin_cash_bank_transaction_line=(DB.fin_cash_bank_transaction_line||[]).filter(l=>Number(l.transaction_id)!==Number(tx.id));
    DB._audit=DB._audit.filter(l=>!(l.e==='fin_cash_bank_transaction'&&l.r===tx.id));
    saveDB(); closeLayer();
    toast('Dokumen dihapus',esc(tx.transaction_no)+' dihapus permanen.','ok');
    if(state.mode!=='list') go(href('fin_cash_bank_transaction')); else render();
  };
}
function cbtActions(id, fromList){
  const tx=(DB.fin_cash_bank_transaction||[]).find(t=>t.id===Number(id)); if(!tx) return [];
  const out=[];
  if(fromList) out.push({label:'Lihat detail',icon:svg(ICON.eye,14),on:()=>go(href('fin_cash_bank_transaction',id))});
  if(tx.status==='Draft'){
    out.push({label:'Ubah dokumen',icon:svg(ICON.pen,14),on:()=>{ CBT_DROP=0; go(href('fin_cash_bank_transaction',id,'edit')); }});
    out.push({label:'Post dokumen',icon:svg(ICON.check,14),on:()=>cbtPost(id)});
    out.push({dv:1});
    out.push({label:'Batalkan',icon:svg(ICON.block,14),on:()=>cbtCancel(id)});
    out.push({label:'Hapus',icon:svg(ICON.trash,14),on:()=>cbtDelete(id)});
  } else if(tx.status==='Cancelled'){
    out.push({label:'Hapus',icon:svg(ICON.trash,14),on:()=>cbtDelete(id)});
  } else {
    out.push({hd:'Dokumen terkunci', sub:'Posted bersifat append-only'});
  }
  return out;
}

/* ================================= jejak realisasi pada halaman Budget ==== */
function budgetRealizationCard(b){
  const list=realizationsOf(b.id);
  if(!list.length) return '';
  return '<div class="card side" style="margin-top:14px"><div class="card-h"><span class="ci">'+svg(ICON.wallet2,15)+'</span>'+
    '<div class="ct"><h3>Dokumen Realisasi</h3></div><span class="hint">'+list.length+'</span></div>'+
    '<div class="card-b"><div class="rzlist">'+
      list.map(x=>'<button class="rzi" data-tx="'+x.tx.id+'">'+
        '<span class="n"><span class="lab">'+esc(x.tx.transaction_no)+'</span>'+statusBadge(x.tx.status,false)+'</span>'+
        '<span class="m"><span class="mny'+(x.tx.status==='Posted'?'':' z')+'">'+
          esc(fmtMoney(x.line.settlement_amount,b.currency_id))+'</span>'+
        '<span class="dt">'+esc(fmtDate(x.tx.document_date))+' · '+esc(purposeLabel(x.tx.purpose))+'</span></span></button>').join('')+
    '</div>'+
    '<p class="sidenote">Hanya dokumen berstatus <b>Posted</b> yang menambah realized_amount Budget.</p>'+
    '</div></div>';
}

/* ============================================================================
   RESET SIMULASI
   ----------------------------------------------------------------------------
   Mengosongkan seluruh data transaksional dan mengembalikan saldo Cash & Bank
   ke saldo pembukaan, tetapi mempertahankan seluruh master dan data accounting.
   Konsep v3 §20 — kembali ke clean base state agar simulasi dapat dijalankan
   dari awal tanpa kehilangan konfigurasi.
   ========================================================================== */
const TRX_TABLES = ['bud_budget','fin_cash_bank_transaction','fin_cash_bank_transaction_line'];
const KEEP_TABLES = ['sys_company','sys_account_type','sys_doc_type','sys_budget_category',
  'sys_partner_category','ref_currency','m_partner','m_cash_bank','acc_account_category',
  'acc_account_subcategory','acc_account','acc_budget_category_account','acc_fiscal_year','acc_fiscal_period'];

function trxCounts(){
  return {
    budget: (DB.bud_budget||[]).length,
    doc:    (DB.fin_cash_bank_transaction||[]).length,
    line:   (DB.fin_cash_bank_transaction_line||[]).length
  };
}
function askReset(){
  const n=trxCounts();
  const moved=(DB.m_cash_bank||[]).filter(c=>Number(c.balance||0)!==Number(CB_OPENING[c.id]||0));
  modal('<div class="mi" style="background:var(--warn-bg);color:var(--warn)">'+svg(ICON.hist,21)+'</div>'+
    '<h3>Reset Simulasi</h3>'+
    '<p>Seluruh data transaksi dihapus dan simulasi kembali ke kondisi kosong. Master dan data accounting tidak tersentuh.</p>'+
    '<div class="wipe">'+
      '<div class="del"><div class="h">'+svg(ICON.trash,12)+' Dihapus</div><ul>'+
        '<li><b>'+n.budget+'</b> Budget</li>'+
        '<li><b>'+n.doc+'</b> Cash Bank Transaction</li>'+
        '<li><b>'+n.line+'</b> baris realisasi</li>'+
        '<li>Riwayat perubahan transaksi</li>'+
      '</ul></div>'+
      '<div class="keep"><div class="h">'+svg(ICON.check,12)+' Dipertahankan</div><ul>'+
        '<li>Company, Partner, Cash &amp; Bank</li>'+
        '<li>Currency dan Budget Category</li>'+
        '<li>Chart of Accounts dan Mapping</li>'+
        '<li>Fiscal Year dan Fiscal Period</li>'+
      '</ul></div>'+
    '</div>'+
    (moved.length? '<div class="apmap warn" style="margin-top:12px">'+svg(ICON.warn,13)+
      ' Saldo '+moved.length+' Cash &amp; Bank dikembalikan ke saldo pembukaan.</div>'
                 : '<div class="apmap" style="margin-top:12px">'+svg(ICON.check,13)+
      ' Saldo Cash &amp; Bank sudah berada pada saldo pembukaan.</div>')+
    '<div class="mf"><button class="btn" id="mNo">Batal</button>'+
    '<button class="btn solid-danger" id="mYes">'+svg(ICON.hist,14)+' Ya, Reset</button></div>');
  $('#layer .modal').style.width='min(560px,94vw)';
  $('#mNo').onclick=closeLayer;
  $('#mYes').onclick=doReset;
}
function doReset(){
  TRX_TABLES.forEach(t=>{ DB[t]=[]; });
  /* jejak audit hanya disisakan untuk entitas master */
  DB._audit=(DB._audit||[]).filter(l=>TRX_TABLES.indexOf(l.e)<0);
  /* saldo Cash & Bank kembali ke saldo pembukaan */
  (DB.m_cash_bank||[]).forEach(c=>{
    if(CB_OPENING[c.id]!==undefined) c.balance=CB_OPENING[c.id];
  });
  saveDB();
  /* bersihkan state layar agar tidak menunjuk record yang sudah tidak ada */
  draft=null; errs={}; dirty=false; CBT_DROP=0; PRINT_SEL={}; PICK={}; BUD_MONTH=0;
  Object.keys(LS).forEach(k=>delete LS[k]);
  closeLayer();
  go('#/finance/fin_cash_bank_transaction'); render();
  toast('Simulasi direset','Data transaksi dikosongkan. Master dan accounting tetap utuh.','ok');
}

/* ============================================================ palette */
let cmdItems=[],cmdSel=0;
function buildCmd(q){
  const s=q.trim().toLowerCase(), menus=[{t:'Dashboard',s:'Ringkasan data master',h:'#/dashboard',k:'Menu',i:ICON.grid}];
  MODULES.forEach(m=>(m.groups||[]).forEach(g=>entitiesOf(m.key,g.key).forEach(e=>
    menus.push({t:e.name,s:m.name+' › '+g.name,h:href(e.key),k:'Menu',i:e.icon}))));
  const mm=menus.filter(o=>!s||(o.t+' '+o.s).toLowerCase().indexOf(s)>-1);
  const recs=[];
  if(s.length>=2) Object.keys(ENTITIES).forEach(k=>{
    const E=ENTITIES[k]; if(E.hidden) return;
    (DB[k]||[]).forEach(r=>{
      if(recs.length>=40) return;
      const d=idOf(k,r);
      if(((d.lab||'')+' '+d.nam).toLowerCase().indexOf(s)>-1)
        recs.push({t:(d.lab?d.lab+' - ':'')+d.nam,s:E.name,h:href(k,r.id),k:'Data',i:E.icon});
    });
  });
  return mm.slice(0,8).concat(recs);
}
function openCmd(){
  $('#layer').innerHTML='<div class="ovl" id="ovl"><div class="cmd">'+
    '<div class="cmd-i">'+svg(ICON.srch,17)+'<input id="cq" placeholder="Cari data atau menu…" autocomplete="off"><kbd>Esc</kbd></div>'+
    '<div class="cmd-l" id="cl"></div></div></div>';
  $('#ovl').addEventListener('mousedown',e=>{ if(e.target.id==='ovl') closeLayer(); });
  const inp=$('#cq');
  const draw=()=>{
    cmdItems=buildCmd(inp.value); cmdSel=0;
    $('#cl').innerHTML=cmdItems.length
      ? cmdItems.map((it,i)=>'<div class="ci2 '+(i===0?'on':'')+'" data-i="'+i+'"><span class="ic">'+svg(it.i,14)+'</span>'+
        '<span class="lb"><b>'+esc(it.t)+'</b><span>'+esc(it.s)+'</span></span><span class="k">'+esc(it.k)+'</span></div>').join('')
      : '<div class="cme">Tidak ada hasil. Coba label atau nama data.</div>';
    $$('#cl .ci2').forEach(e=>e.onclick=()=>{ closeLayer(); go(cmdItems[+e.dataset.i].h); });
  };
  draw(); inp.oninput=draw;
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      cmdSel=Math.max(0,Math.min(cmdItems.length-1,cmdSel+(e.key==='ArrowDown'?1:-1)));
      $$('#cl .ci2').forEach((n,i)=>n.classList.toggle('on',i===cmdSel));
      const on=$('#cl .ci2.on'); if(on) on.scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'&&cmdItems[cmdSel]){ closeLayer(); go(cmdItems[cmdSel].h); }
  };
  setTimeout(()=>inp.focus(),20);
}

/* ============================================================ global */
function doExport(){
  const blob=new Blob([JSON.stringify({exported_at:nowTs(),tables:DB},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='siba-master-data.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Export dimulai','Data master diunduh sebagai JSON.','ok');
}
function doRestore(){
  modal('<div class="mi" style="background:var(--warn-bg);color:var(--warn)">'+svg(ICON.hist,20)+'</div>'+
    '<h3>Muat Ulang Data Awal</h3><p>Seluruh perubahan pada sesi ini akan dibuang dan data kembali ke kondisi awal.</p>'+
    '<div class="mf"><button class="btn" id="mNo">Batal</button><button class="btn primary" id="mYes">Ya, Muat Ulang</button></div>');
  $('#mNo').onclick=closeLayer;
  $('#mYes').onclick=()=>{ resetDB(); closeLayer(); CTX_COMPANY=0; Object.keys(LS).forEach(k=>delete LS[k]);
    go('#/dashboard'); render(); toast('Data dimuat ulang','Kembali ke kondisi awal.','ok'); };
}
function showHelp(){
  modal('<div class="mi" style="background:var(--brand-50);color:var(--brand)">'+svg(ICON.grid,20)+'</div>'+
    '<h3>Pintasan Keyboard</h3><p style="margin-bottom:14px">Beberapa pintasan untuk mempercepat pekerjaan sehari-hari.</p>'+
    '<div style="text-align:left;display:flex;flex-direction:column;gap:9px">'+
      [['Ctrl + K','Pencarian global'],['/','Fokus ke pencarian pada list'],['N','Tambah data baru'],
       ['Esc','Kembali atau tutup dialog'],['← →','Pindah antar record di halaman detail']]
      .map(k=>'<div class="kbrow"><kbd style="min-width:62px;text-align:center">'+esc(k[0])+'</kbd><span>'+esc(k[1])+'</span></div>').join('')+
    '</div><div class="mf"><button class="btn primary" id="mOk">Tutup</button></div>');
  $('#mOk').onclick=closeLayer;
}

/* ============================================================ boot */
(function(){
  loadDB();
  $('#burger').onclick=()=>document.body.classList.toggle('nav-open');
  $('#scrim').onclick =()=>document.body.classList.remove('nav-open');
  $('#reopen').onclick=()=>document.body.classList.remove('sub-off');
  $('#btnHelp').onclick=showHelp;
  $('#btnReset').onclick=askReset;
  $('#btnUser').onclick=()=>{
    const r=$('#btnUser').getBoundingClientRect();
    menuAt(r.right-200,r.bottom+7,[
      {hd:USERS[CURRENT_USER].name, sub:USERS[CURRENT_USER].email},
      {dv:1},
      {label:'Pintasan keyboard',icon:svg(ICON.grid,14),on:showHelp},
      {label:'Export data',icon:svg(ICON.down,14),on:doExport},
      {label:'Muat ulang seluruh data awal',icon:svg(ICON.hist,14),on:doRestore},
      {label:'Reset simulasi (transaksi saja)',icon:svg(ICON.trash,14),on:askReset},
      {dv:1},
      {label:'Keluar',icon:svg(ICON.out,14),on:()=>toast('Keluar','Fitur autentikasi belum aktif.')}
    ]);
  };
  $('#globalSearch').onfocus=e=>{ e.target.blur(); openCmd(); };
  $('#globalSearch').onclick=openCmd;
  $('#ctxCompany').onchange=e=>{
    CTX_COMPANY=+e.target.value; Object.keys(LS).forEach(k=>LS[k].page=1);
    if(state.mode!=='list'&&state.entity&&ENTITIES[state.entity].scope) go(href(state.entity)); else render();
  };
  document.addEventListener('keydown',e=>{
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'');
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); return; }
    if(e.key==='Escape'){
      if(CB){ closeCB(); return; }
      if($('#layer').innerHTML){ closeLayer(); return; }
      if(state.mode==='edit'&&state.entity){ draft=null;errs={};dirty=false; go(href(state.entity,state.id)); return; }
      if((state.mode==='new'||state.mode==='view')&&state.entity){ go(href(state.entity)); return; }
      return;
    }
    if(typing) return;
    if(e.key==='/'){ const q=$('#lq'); if(q){ e.preventDefault(); q.focus(); q.select(); } return; }
    if(e.key.toLowerCase()==='n'&&state.entity&&state.mode==='list'){ e.preventDefault(); go(href(state.entity,'new')); return; }
    if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&state.mode==='view'){
      const b=$$('#view [data-nav]')[e.key==='ArrowLeft'?0:1];
      if(b&&!b.disabled&&b.dataset.nav){ e.preventDefault(); go(href(state.entity,b.dataset.nav)); }
    }
  });
  addEventListener('resize',closeCB);
  addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  if(!location.hash) location.hash='#/dashboard';
  route();
})();
</script>
